  <script>
    /* La escena empieza en el global 5,268 s: los beats van en global. */
    const INICIO = 5.268;
    const b = (n) => window.beat(n) - INICIO;

    const tl = gsap.timeline({ paused: true });

    /* El mesh respira. */
    tl.fromTo("#s2-mesh-a", { x: 0, y: 0 }, { x: 150, y: 110, duration: 7.059, ease: "none" }, 0);
    tl.fromTo("#s2-mesh-b", { x: 0, y: 0 }, { x: -170, y: -120, duration: 7.059, ease: "none" }, 0);

    /* "Conoce" y el isotipo, que entra con un destello de cristal. */

      "#s2-c1",
      { opacity: 0, filter: "blur(16px)", y: 26 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.42, ease: "power4.out" },
      b(13)
    );
    tl.fromTo(
      "#s2-isotipo",
      { opacity: 0, x: -70, scale: 0.7, rotate: -14 },
      { opacity: 1, x: 0, scale: 1, rotate: 0, duration: 0.7, ease: "back.out(1.7)" },
      b(14)
    );
    tl.fromTo(
      "#s2-c2",
      { opacity: 0, filter: "blur(16px)", y: 26 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.42, ease: "power4.out" },
      b(15)
    );
    tl.fromTo(
      "#s2-isotipo-svg",
      { filter: "brightness(1)" },
      { filter: "brightness(2.4)", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 },
      b(14) + 0.35
    );

    /* El escritorio entra en 3D (frame 450 del guion = 2,23 s local). */
    tl.fromTo(
      "#s2-app",
      { opacity: 0, scale: 0.72, rotateX: 34, rotateY: -26, y: 90 },
      { opacity: 1, scale: 1, rotateX: 0, rotateY: 0, y: 0, duration: 1.25, ease: "power3.out" },
      b(18)
    );
    tl.fromTo(
      "#s2-sombra",
      { opacity: 0, scaleX: 0.4 },
      { opacity: 1, scaleX: 1, duration: 1.1, ease: "power3.out" },
      b(18)
    );

    /* El titulo da paso a la promesa. */
    tl.to("#s2-titulo", { opacity: 0, y: -50, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, b(20));
    tl.fromTo(
      "#s2-promise",
      { opacity: 0, y: 60, filter: "blur(16px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" },
      b(20) + 0.12
    );

    /* La camara recorre los modulos de la barra lateral. */
    for (let i = 0; i < 7; i++) {
      tl.to(
        `#s2-app .app__item[data-nav="${i}"]`,
        { color: "#0088ff", backgroundColor: "rgba(0,136,255,0.12)", duration: 0.24, ease: "power2.out" },
        b(22) + i * 0.16
      );
      tl.to(
        `#s2-app .app__item[data-nav="${i}"]`,
        { color: "#9aa0aa", backgroundColor: "rgba(0,136,255,0)", duration: 0.24, ease: "power2.in" },
        b(22) + i * 0.16 + 0.24
      );
    }

    /* La promesa se aparta y el escritorio se queda. */
    tl.to("#s2-promise", { opacity: 0, y: -70, filter: "blur(14px)", duration: 0.6, ease: "power2.in" }, b(27));
    tl.to("#s2-app", { scale: 1.06, y: -30, duration: 1.1, ease: "power2.inOut" }, b(27));
    tl.to("#s2-app", { scale: 1.02, y: -18, duration: 1.6, ease: "sine.inOut" }, b(28.5));

    window.__timelines["s2"] = tl;
