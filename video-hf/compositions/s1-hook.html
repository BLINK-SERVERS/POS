  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">

  <script>
    /* La rejilla: 153 BPM con el primer golpe en 0,17 s. */
    const b = (n) => window.beat(n);

    const tl = gsap.timeline({ paused: true });

    /* Las esferas derivan despacio, sin parar. */
    tl.fromTo(
      "#s1-esfera-a",
      { x: 0, y: 0 },
      { x: 130, y: 90, duration: 5.268, ease: "none" },
      0
    );
    tl.fromTo(
      "#s1-esfera-b",
      { x: 0, y: 0 },
      { x: -150, y: -110, duration: 5.268, ease: "none" },
      0
    );

    /* Los tokens y los recibos entran escalonados, sobre el beat. */
    const flotan = [
      ["#s1-token-a", b(1), -60, 40],
      ["#s1-r1", b(1), -40, 30],
      ["#s1-token-b", b(2), 60, -40],
      ["#s1-r2", b(3), -50, 34],
      ["#s1-token-c", b(4), 50, -30],
      ["#s1-r3", b(5), -44, 28],
      ["#s1-r4", b(6), 56, -34],
    ];
    for (const [sel, t0, dx, dy] of flotan) {
      tl.fromTo(
        sel,
        { opacity: 0, x: dx, y: dy, scale: 0.94, filter: "blur(10px)" },
        { opacity: 1, x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.6)" },
        t0
      );
    }

    /* Deriva continua de lo que queda en pantalla. */
    tl.to("#s1-token-a", { y: "-=18", duration: 2.2, ease: "sine.inOut" }, b(2));
    tl.to("#s1-token-a", { y: "+=18", duration: 2.2, ease: "sine.inOut" }, b(2) + 2.2);
    tl.to("#s1-r1", { y: "-=14", duration: 2.4, ease: "sine.inOut" }, b(3));
    tl.to("#s1-r1", { y: "+=14", duration: 2.4, ease: "sine.inOut" }, b(3) + 2.4);

    /* El titular se escribe palabra a palabra, en los beats. */
    /* La primera palabra ya esta en pantalla (desenfocada): el
       fotograma 0 es la miniatura en los reproductores sociales. */
    tl.fromTo(
      "#s1-p1",
      { opacity: 1, filter: "blur(16px)", y: 34 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.45, ease: "power4.out" },
      0
    );
    tl.fromTo(
      "#s1-p2",
      { opacity: 0, filter: "blur(16px)", y: 34 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.45, ease: "power4.out" },
      b(2)
    );

    /* La barra azul barre el texto y lo borra de un solo trazo. */
    tl.fromTo(
      "#s1-barra",
      { opacity: 1, x: -1560 },
      { opacity: 1, x: 0, duration: 0.62, ease: "power2.inOut" },
      b(8)
    );
    tl.fromTo(
      "#s1-frase-b",
      { clipPath: "inset(0 0 0 0%)" },
      { clipPath: "inset(0 0 0 100%)", duration: 0.62, ease: "power2.inOut" },
      b(8)
    );
    tl.fromTo(
      "#s1-frase-a",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power1.out" },
      b(8) + 0.18
    );
    tl.to("#s1-barra", { opacity: 0, duration: 0.25 }, b(8) + 0.62);

    /* El zoom final: la camara se mete en el texto. */
    tl.fromTo(
      "#s1-frase-a",
      { scale: 1 },
      { scale: 1.16, duration: 1.1, ease: "power2.inOut" },
      b(9)
    );
    tl.to(
      "#root",
      {},
      { duration: 0.01 },
      0
    );

    window.__timelines["s1"] = tl;
  </script>
