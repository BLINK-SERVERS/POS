  <script>
    const INICIO = 18.994;
    const b = (n) => window.beat(n) - INICIO;

    const tl = gsap.timeline({ paused: true });

    /* Los cuatro dispositivos entran en diagonal, sobre el beat. */
    const dispositivos = [
      ["#s4-d1", b(48), -260, -180],
      ["#s4-d2", b(49), 260, -180],
      ["#s4-d3", b(50), -260, 180],
      ["#s4-d4", b(51), 260, 180],
    ];
    for (const [sel, t0, dx, dy] of dispositivos) {
      tl.fromTo(
        sel,
        { opacity: 0, x: dx, y: dy, rotate: dx > 0 ? 9 : -9, scale: 0.9 },
        { opacity: 1, x: 0, y: 0, rotate: 0, scale: 1, duration: 0.85, ease: "power3.out" },
        t0
      );
    }

    /* El titular ocupa el centro. */
    tl.fromTo(
      "#s4-texto",
      { opacity: 0, filter: "blur(16px)", y: 40 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.6, ease: "power4.out" },
      b(50)
    );

    /* El corte a oscuro (frame 1320 = 3,01 s local). */
    tl.to("#s4-noche", { opacity: 1, duration: 0.55, ease: "power2.inOut" }, b(57));
    tl.to("#s4-aurora-a", { opacity: 0.36, duration: 0.55 }, b(57));
    tl.to("#s4-aurora-b", { opacity: 0.28, duration: 0.55 }, b(57));
    tl.to("#s4-texto", { opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power2.in" }, b(57));
    tl.to("#s4-d1", { opacity: 0, scale: 0.9, duration: 0.45, ease: "power2.in" }, b(57));
    tl.to("#s4-d2", { opacity: 0, scale: 0.9, duration: 0.45, ease: "power2.in" }, b(57));
    tl.to("#s4-d3", { opacity: 0, scale: 0.9, duration: 0.45, ease: "power2.in" }, b(57));
    tl.to("#s4-d4", { opacity: 0, scale: 0.9, duration: 0.45, ease: "power2.in" }, b(57));

    /* Los corchetes se cierran sobre el texto. */
    tl.fromTo(
      "#s4-corchetes",
      { opacity: 0, x: -260, scale: 0.7 },
      { opacity: 1, x: 0, scale: 1, duration: 0.42, ease: "back.out(2.2)" },
      b(57)
    );
    tl.fromTo(
      "#s4-bracket",
      { opacity: 0, scale: 1.14, filter: "blur(14px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(2)" },
      b(57) + 0.1
    );

    /* La camara tira hacia atras y atraviesa los corchetes. */
    tl.to("#s4-bracket", { scale: 1.06, duration: 1.2, ease: "power2.inOut" }, b(59));

    window.__timelines["s4"] = tl;
  </script>
